#cloud-config

apt_update: true
apt_upgrade: true

packages:
  - apt-transport-https 
  - ca-certificates 
  - curl

users:
  - name: appuser
    sudo: ALL=(ALL) NOPASSWD:ALL
    home: /home/appuser
    shell: /bin/bash
    ssh_authorized_keys:
      - <SSH_AUTHORIZED_KEYS> 
      #- ssh-rsa  ubuntu@jannik-recklies

runcmd:
  #- curl -sfL https://get.k3s.io | K3S_URL=https://192.168.2.240:6443 K3S_TOKEN=K10dc8dea9fa0092a9fb70bc98597b7411949399cab0827e8c3ae9291c0af563f11::server:831b3a3a4a7f9c54e256cedb02a23343 sh -
  - curl -sfL https://get.k3s.io | K3S_URL=https://<K3S_IP>:6443 K3S_TOKEN=<K3S_TOKEN> sh -

byobu_default: system

final_message: "The system is finally up, after $UPTIME seconds"
